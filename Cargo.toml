[package]
name = "keyway"
readme = "README.md"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "keyway"
path = "src/main.rs"

[dependencies]

gpui = { workspace = true }
gpui_platform = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["keyway-apps"]
license = "AGPL-3.0"

[workspace.dependencies]

#
# Workspace member crates
#


#
# External crates
#

anyhow = "1"
dirs = "6"
env_logger = "0.11"
futures = "0.3.32"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
image = "0.25.10"
log = "0.4"
nucleo = "0.5"
rust-embed = "8.11"
regex = "1.12"
serde = "1"
serde_json = "1"
tokio = { version = "1" }
toml = "0.9"
wasmtime = "45"