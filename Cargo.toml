[workspace]
resolver = "3"
members = [
    # Foundation crates
    "crates/assets",
    "crates/cli",
    "crates/collections",
    "crates/config",
    "crates/runtime",
    "crates/db",
    "crates/extension",
    "crates/i18n",
    "crates/ipc",
    "crates/keyway",
    "crates/net",
    "crates/onboarding",
    "crates/paths",
    "crates/theme",
    "crates/ktracing",
    "crates/ui",
    "crates/util",
    "crates/window",
    "crates/workspace",

    # Feature crates
    "crates/agent",
    "crates/calculator",
    "crates/clipboard",
    "crates/devtools",
    "crates/emoji",
    "crates/file-search",
    "crates/notes",
    "crates/screenshot",
    "crates/settings",
    "crates/store",
]
default-members = ["crates/keyway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["keyway-apps"]
license = "AGPL-3.0"

[workspace.dependencies]

#
# Workspace member crates
#

# Foundation crates
assets = { path = "crates/assets" }
collections = { path = "crates/collections" }
config = { path = "crates/config" }
runtime = { path = "crates/runtime" }
db = { path = "crates/db" }
extension = { path = "crates/extension" }
i18n = { path = "crates/i18n" }
ipc = { path = "crates/ipc" }
ktracing = { path = "crates/ktracing" }
net = { path = "crates/net" }
paths = { path = "crates/paths" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
util = { path = "crates/util" }
window = { path = "crates/window" }
workspace = { path = "crates/workspace" }

# Feature crates
agent = { path = "crates/agent" }
calculator = { path = "crates/calculator" }
clipboard = { path = "crates/clipboard" }
devtools = { path = "crates/devtools" }
emoji = { path = "crates/emoji" }
file_search = { path = "crates/file-search" }
notes = { path = "crates/notes" }
screenshot = { path = "crates/screenshot" }
settings = { path = "crates/settings" }
store = { path = "crates/store" }

#
# External crates
#

anyhow = "1"
clap = "4.6"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui_tokio = { git = "https://github.com/zed-industries/zed" }
image = "0.25.10"
nucleo = "0.5"
once_cell = "1.21.4"
rust-embed = { version = "8.11", features = ["include-exclude"] }
rust-i18n = "4.2"
rustc-hash = "2.1.3"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tarpc = { version = "0.37", features = ["serde-transport", "tokio1", "serde1"] }
tokio-serde = { version = "0.9", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uds_windows = "1.2"
wasmtime = "46"
