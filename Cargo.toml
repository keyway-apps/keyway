[workspace]
resolver = "3"
members = [
    # Foundation crates
    "crates/assets",
    "crates/cli",
    "crates/collections",
    "crates/config",
    "crates/core",
    "crates/db",
    "crates/extension",
    "crates/i18n",
    "crates/ipc",
    "crates/keyway",
    "crates/net",
    "crates/onboarding",
    "crates/paths",
    "crates/theme",
    "crates/ktracing",
    "crates/ui",
    "crates/util",
    "crates/window",
    "crates/workspace",

    # Feature crates
    "crates/agent",
    "crates/calculator",
    "crates/clipboard",
    "crates/devtools",
    "crates/emoji",
    "crates/file-search",
    "crates/notes",
    "crates/screenshot",
    "crates/settings",
    "crates/store",
]
default-members = ["crates/keyway"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["keyway-apps"]
license = "AGPL-3.0"

[workspace.dependencies]

#
# Workspace member crates
#

# Foundation crates
keyway_assets = { path = "crates/assets" }
keyway_collections = { path = "crates/collections" }
keyway_config = { path = "crates/config" }
keyway_core = { path = "crates/core" }
keyway_db = { path = "crates/db" }
keyway_extension = { path = "crates/extension" }
keyway_i18n = { path = "crates/i18n" }
keyway_ipc = { path = "crates/ipc" }
keyway_ktracing = { path = "crates/ktracing" }
keyway_net = { path = "crates/net" }
keyway_paths = { path = "crates/paths" }
keyway_theme = { path = "crates/theme" }
keyway_ui = { path = "crates/ui" }
keyway_util = { path = "crates/util" }
keyway_window = { path = "crates/window" }
keyway_workspace = { path = "crates/workspace" }

# Feature crates
keyway_agent = { path = "crates/agent" }
keyway_calculator = { path = "crates/calculator" }
keyway_clipboard = { path = "crates/clipboard" }
keyway_devtools = { path = "crates/devtools" }
keyway_emoji = { path = "crates/emoji" }
keyway_file_search = { path = "crates/file-search" }
keyway_notes = { path = "crates/notes" }
keyway_screenshot = { path = "crates/screenshot" }
keyway_settings = { path = "crates/settings" }
keyway_store = { path = "crates/store" }

#
# External crates
#

anyhow = "1"
clap = "4.6"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui_tokio = { git = "https://github.com/zed-industries/zed" }
image = "0.25.10"
nucleo = "0.5"
once_cell = "1.21.4"
rust-embed = { version = "8.11", features = ["include-exclude"] }
rust-i18n = "4.2"
rustc-hash = "2.1.3"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tarpc = { version = "0.37", features = ["serde-transport", "tokio1", "serde1"] }
tokio-serde = { version = "0.9", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uds_windows = "1.2"
wasmtime = "46"
